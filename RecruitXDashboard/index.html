<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <title>Recruitment Analytics Dashboard</title>
</head>
<body>
    <header class="dashboard__header">
        <div id="header-section-title" class="dashboard__title">RecruitX</div>
        <div class="dashboard__rightside">
            <div class="tab-container">
                <button class="tab tab-container__button active" data-tab="analytics">Recruitment Analytics</button>
                <button class="tab tab-container__button" data-tab="jobPostings" onclick="jobPostings();">Job Postings</button>
            </div>
            <div class="profile-container">
                <img src="images/Profile (1).svg" alt="profile picture">
            </div>
        </div>
    </header>
    <main class="dashboard__content">
        <section class="article-container">
            <div id="recruitmentAnalytics" class="article-container__section">
                <div id="filterExport">

                </div>
                <div>
                    <div class="data-metrics">

                    </div>
                    <div class="funnel-sources__container">

                    </div>
                    <div class="gender-hireday-age__container">

                    </div>
                </div>
                
            </div>

            <div id="jobPostings" class="hidden job__container">

                <div class="job-container">
                    <header class="job-container__header">
                        <h1 class="job-container__heading">Job Postings</h1>
                    </header>        
                    <div class="loading-indicator" id="loading-indicator">
                        <div class="loading-indicator__spinner spinner"></div>
                        <p class="loading-indicator__text">Loading job data...</p>
                    </div>
                    
                    <div class="filter-section filters">
                        <input type="text" id="search-input" placeholder="Search jobs..." class="filter-section__search-input search-input">
                        <select id="location-filter" class="filter-section__location-filter filter-select">
                            <option value="">All Locations</option>
                            </select>
                        <select id="du-filter" class="filter-section__du-filter filter-select">
                            <option value="">All DUs</option>
                            </select>
            
                    </div>
            
                    <div id="job-table" class="job-table"></div>
                    
                    <div class="error-message" id="error-message">
                        <p class="error-message__text">Unable to load job data. Please try again later.</p>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p class="footer-text">© <span id="currentYear"></span> ILP Group 1. All Rights Reserved.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Terms</a>
                <a href="#" class="footer-link">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
