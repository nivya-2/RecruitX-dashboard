<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="Stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <title>Recruitment Analytics Dashboard</title>
</head>
<body>
    <header class="dashboard__header">
        <div id="header-section-title" class="dashboard__title">RecruitX</div>
        <div class="dashboard__rightside">
            <div class="tab-container">
                <button class="tab tab-container__button active" data-tab="analytics">Recruitment Analytics</button>
                <button class="tab tab-container__button" data-tab="jobPostings">Job Postings</button>
            </div>
            <div class="profile-container">
                <img src="/images/Profile (1).svg" alt="profile picture">
            </div>
        </div>
    </header>
    <main class="dashboard__content">
        <section class="article-container">
            <div id="recruitmentAnalytics" class="article-container__section">
                <div id="filterExport">
                    <div class="year-filter-container">
                        <i class="fas fa-calendar-alt"></i>
                        <select id="yearSelect" class="year-filter__select">
                        </select>
                    </div>
                </div>
                <div>
                    <div class="data-metrics">

                    </div>
                    <div class="funnel-sources__container">
                        <div class="funnel-chart__heading">
                            <p>Recruitment Funnel: <br>Hiring Success Rate by Stage </p>
                        </div>
                        <div class="funnel-chart__container">
                            <div class="width-line-initial">
                                <p>100%</p>
                                <div class="vertical-lines"></div>
                                <div class="horizontal-line"></div>
                            </div>
                            <div class="funnel-chart-data">
                                <div class="data-container">
                                    <div class="data-heading">
                                        Application Recieved
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar applications-recieved "></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Applications screened
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar applications-screened"></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Technical Round Completed
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar technical-round"></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Management Round Completed
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar management-round"></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Documents Collected
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar documents-collected"></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Salary Approved
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar salary-approved"></div>
                                    </div>
                                </div>
                
                                <div class="data-container">
                                    <div class="data-heading">
                                        Offer Accepted
                                    </div>
                                    <div class="graph-container">
                                        <div class="graph-bar offer-accepted"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="width-line-final">
                                <div class="vertical-lines"></div>
                                <div class="horizontal-line"></div>
                                <p></p>
                            </div>
                        </div>
                    </div>
                    <div class="gender-hireday-age__container">

                    </div>
                </div>
                
            </div>

            <div id="jobPostings" class="hidden job__container">
                <!-- <h2>Job Postings Content</h2> -->
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p class="footer-text">© <span id="currentYear"></span> ILP Group 1. All Rights Reserved.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">Terms</a>
                <a href="#" class="footer-link">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
